name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests resolve @zepher/* through dist/, so build first.
      - name: Build
        run: pnpm run build

      - name: Run test suite
        run: pnpm test

      - name: Verify agent configs are in sync with .zepher/
        run: node apps/cli/bin/zepher.js verify
